name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Pinned: Playwright 1.60 does not support Ubuntu 26.04, which ubuntu-latest now uses.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q
